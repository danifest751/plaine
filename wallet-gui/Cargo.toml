[workspace]

[package]
name = "plaine-wallet-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
description = "Desktop wallet for Plaine. Signs with plaine-wallet's code; talks to a node over its local RPC. Not linked into the node."

[[bin]]
name = "plaine-wallet-gui"
path = "src/main.rs"

[dependencies]
plaine-wallet = { path = "../wallet" }
plaine-consensus = { path = "../lib/consensus" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit"] }

[dev-dependencies]
egui_kittest = "0.36"

[profile.release]
overflow-checks = true
