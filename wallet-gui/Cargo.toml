[workspace]

[package]
name = "plaine-wallet-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
description = "Desktop wallet for Plaine. Signs with plaine-wallet's code; talks to a node over its local RPC. Not linked into the node."

[[bin]]
name = "plaine-wallet-gui"
path = "src/main.rs"

[[bin]]
name = "plaine-wallet-cli"
path = "src/bin/plaine-wallet-cli.rs"

[dependencies]
plaine-wallet = { path = "../wallet" }
plaine-consensus = { path = "../lib/consensus" }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
# The memory-hard KDF for key files (kdf: argon2id-v1). It lives here, not in
# plaine-wallet, whose dependency policy admits no KDF library; see src/kdf.rs.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
egui_kittest = "0.36"

[profile.release]
overflow-checks = true
